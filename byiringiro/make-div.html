<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Div Creator</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f4f4f4;
            padding: 40px;
        }

        .container{
            max-width: 600px;
            margin: auto;
        }

        button{
            padding: 12px 20px;
            background-color: #e53935;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover{
            background-color: #c62828;
        }

        .card{
            background-color: white;
            border-left: 6px solid #e53935;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            animation: fade 0.4s ease;
        }

        @keyframes fade{
            from{
                opacity: 0;
                transform: translateY(10px);
            }

            to{
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <button onclick="createDiv()">
            Create New Div
        </button>

        <div id="content"></div>

    </div>

    <script>

        let count = 1;

        function createDiv(){

            const div = document.createElement("div");

            div.className = "card";

            div.innerHTML = `
                <h3>Dynamic Div ${count}</h3>
                <p>This div was created using JavaScript.</p>
            `;

            document.getElementById("content").appendChild(div);

            count++;
        }

    </script>

</body>
</html>
