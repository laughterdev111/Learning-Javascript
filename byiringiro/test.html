<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Traffic Light Simulator</title>
    <style>
        /* Modern, clean reset & centered layout */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            gap: 30px;
        }

        /* Realistic Traffic Light Housing */
        .card {
            background-color: #262626;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.05);
            border: 4px solid #333;
            border-radius: 30px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100px;
        }

        /* Light Reflector Bulbs */
        .color-card {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #111; /* Default turned off state */
            border: 3px solid #1a1a1a;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        /* Status Text Area */
        #paragraph {
            margin: 5px 0 0 0;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            height: 24px; /* Prevents layout shifting when empty */
            text-shadow: 0 0 10px currentColor;
        }

        /* Control Panel Container */
        .button-group {
            display: flex;
            gap: 12px;
            background-color: #262626;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Premium Buttons Base Styling */
        button {
            cursor: pointer;
            height: 45px;
            width: 90px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Theme Styling for individual controller buttons */
        #btn-red { background-color: #ff3b30; color: white; }
        #btn-yellow { background-color: #ffcc00; color: #111; }
        #btn-green { background-color: #34c759; color: white; }
        #reset { background-color: #8e44ad; color: white; }

    </style>
</head>
<body>

    <!-- Traffic Light Structure -->
    <div class="card">
        <div class="color-card" id="Red"></div>
        <div class="color-card" id="yellow"></div>
        <div class="color-card" id="green"></div>
        <p id="paragraph"></p>
    </div>

    <!-- Controller Buttons -->
    <div class="button-group">
        <button onclick="change('red')" id="btn-red">red</button>
        <button onclick="change('yellow')" id="btn-yellow">yellow</button>
        <button onclick="change('green')" id="btn-green">green</button>
        <button onclick="change('porpo')" id="reset">Reset</button>
    </div>

<script>
    // Resets bulbs back to dark transparency instead of flat solid black
    function reset(){
        document.getElementById("Red").style.backgroundColor = "#111";
        document.getElementById("Red").style.boxShadow = "inset 0 5px 10px rgba(0,0,0,0.8)";
        
        document.getElementById("yellow").style.backgroundColor = "#111";
        document.getElementById("yellow").style.boxShadow = "inset 0 5px 10px rgba(0,0,0,0.8)";
        
        document.getElementById("green").style.backgroundColor = "#111";
        document.getElementById("green").style.boxShadow = "inset 0 5px 10px rgba(0,0,0,0.8)";
    }

    function change(color){
        reset();
        const paragraph = document.getElementById('paragraph');
        
        switch (color){
            case 'red':
                document.getElementById("Red").style.backgroundColor = "#ff3b30";
                // Adds a neon light glow effect
                document.getElementById("Red").style.boxShadow = "0 0 20px #ff3b30, inset 0 2px 5px rgba(255,255,255,0.4)";
                paragraph.innerHTML = 'STOP!';
                paragraph.style.color = '#ff3b30';
                break;

            case 'yellow':
                document.getElementById("yellow").style.backgroundColor = "#ffcc00";
                document.getElementById("yellow").style.boxShadow = "0 0 20px #ffcc00, inset 0 2px 5px rgba(255,255,255,0.4)";
                paragraph.innerHTML = 'BE READY!';
                paragraph.style.color = '#ffcc00';
                break;

            case 'green':
                document.getElementById("green").style.backgroundColor = "#34c759";
                document.getElementById("green").style.boxShadow = "0 0 20px #34c759, inset 0 2px 5px rgba(255,255,255,0.4)";
                paragraph.innerHTML = 'GO!';
                paragraph.style.color = '#34c759';
                break;

            default:
                console.log("error");
                paragraph.innerHTML = '';
        }
    }
</script>
</html>
