<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container{
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-box{
            display: flex;
            gap: 10px;
        }

        input{
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button{
            padding: 12px 18px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #0056b3;
        }

        #div{
            margin-top: 20px;
        }

        .student{
            background: #eef4ff;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border-left: 5px solid #007bff;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Student List</h1>

        <div class="input-box">

            <input 
                type="text" 
                placeholder="Enter new student"
                id="input"
            >

            <button onclick="add()">
                Add
            </button>

        </div>

        <div id="div"></div>

    </div>

    <script>

        const store = [];

        function add(){

            var input = document.getElementById("input").value;

            // stop empty input
            if(input.trim() === ""){
                alert("Please enter a student name");
                return;
            }

            // add into array
            store.push(input);

            // clear old output
            document.getElementById("div").innerHTML = "";

            // loop through array
            for(let i = 0; i < store.length; i++){

                document.getElementById("div").innerHTML += `
                    <div class="student">
                        ${store[i]}
                    </div>
                `;
            }

            // clear input
            document.getElementById("input").value = "";
        }

    </script>

</body>
</html>
