<body>

    <div id="host">hhhhhhhhhhhh <br><br><br>nnnnnnnnnnnnnnnnnnnnnnnnnnnn
    </div>
    <script>
function change(){

    const store={
        blue:"blue",
        red:"red"
    }
     div.style.backgroundColor = store[color];
    
}
    </script>
