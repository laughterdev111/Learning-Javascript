

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container{
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        input{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover{
            background: #0056b3;
        }

        #output{
            margin-top: 20px;
        }

        .line{
            background: #eef4ff;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border-left: 5px solid #007bff;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Multiplication Table</h1>

        <input 
            type="number" 
            id="input" 
            placeholder="Enter a number"
        >

        <button onclick="showTable()">
            Show Table
        </button>

        <div id="output"></div>

    </div>

    <script>

        function showTable(){

            var number = document.getElementById("input").value;

            // clear old output
            document.getElementById("output").innerHTML = "";

            // loop
            for(let i = 1; i <= 20; i++){

                document.getElementById("output").innerHTML += `
                    <div class="line">
                        ${number} × ${i} = ${number * i}
                    </div>
                `;
            }
        }

    </script>

</body>
